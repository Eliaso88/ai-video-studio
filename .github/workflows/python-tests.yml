name: Python Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-backend.txt
          python -m pip install -r workers/requirements_test.txt

      - name: Run backend tests
        run: |
          python -m pytest backend/test_routes.py -v
          python -m pytest workers/test_video_generator.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm config set audit false
          npm ci
          npm exec playwright install --with-deps

      - name: Start backend server
        shell: pwsh
        run: |
          $backendStdout = Join-Path $env:GITHUB_WORKSPACE 'backend-server.out.log'
          $backendStderr = Join-Path $env:GITHUB_WORKSPACE 'backend-server.err.log'
          Write-Host "Starting backend server and logging to $backendStdout / $backendStderr"
          Start-Process -FilePath python -ArgumentList '-m','uvicorn','backend.app:app','--host','127.0.0.1','--port','8000' -WorkingDirectory "${{ github.workspace }}" -NoNewWindow -RedirectStandardOutput $backendStdout -RedirectStandardError $backendStderr -PassThru | Out-Null
          Start-Sleep -Seconds 10
          Write-Host "Backend process preview:"
          Get-Process -Name python -ErrorAction SilentlyContinue | Select-Object -First 5 | Format-Table Id,ProcessName,Path
          Write-Host "Backend startup preview (stdout):"
          if (Test-Path $backendStdout) { Get-Content $backendStdout -Tail 20 }
          Write-Host "Backend startup preview (stderr):"
          if (Test-Path $backendStderr) { Get-Content $backendStderr -Tail 20 }

      - name: Start frontend server
        shell: pwsh
        run: |
          $frontendStdout = Join-Path $env:GITHUB_WORKSPACE 'frontend-server.out.log'
          $frontendStderr = Join-Path $env:GITHUB_WORKSPACE 'frontend-server.err.log'
          Write-Host "Starting frontend server and logging to $frontendStdout / $frontendStderr"
          Start-Process -FilePath npm -ArgumentList 'run','dev','--','--hostname','127.0.0.1','--port','3000' -WorkingDirectory "${{ github.workspace }}\frontend" -NoNewWindow -RedirectStandardOutput $frontendStdout -RedirectStandardError $frontendStderr -PassThru | Out-Null
          Start-Sleep -Seconds 20
          Write-Host "Frontend process preview:"
          Get-Process -Name node -ErrorAction SilentlyContinue | Select-Object -First 5 | Format-Table Id,ProcessName,Path
          Write-Host "Frontend startup preview (stdout):"
          if (Test-Path $frontendStdout) { Get-Content $frontendStdout -Tail 20 }
          Write-Host "Frontend startup preview (stderr):"
          if (Test-Path $frontendStderr) { Get-Content $frontendStderr -Tail 20 }

      - name: Wait for servers
        shell: pwsh
        run: |
          $backendStdout = Join-Path $env:GITHUB_WORKSPACE 'backend-server.out.log'
          $backendStderr = Join-Path $env:GITHUB_WORKSPACE 'backend-server.err.log'
          $frontendStdout = Join-Path $env:GITHUB_WORKSPACE 'frontend-server.out.log'
          $frontendStderr = Join-Path $env:GITHUB_WORKSPACE 'frontend-server.err.log'
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            $backendReady = $false
            $frontendReady = $false

            try {
              Write-Host "Checking backend at http://127.0.0.1:8000/api/health"
              Invoke-WebRequest -Uri http://127.0.0.1:8000/api/health -UseBasicParsing -TimeoutSec 10 | Out-Null
              Write-Host "Backend is responding"
              $backendReady = $true
            } catch {
              Write-Host "Backend not ready: $_"
            }

            try {
              Write-Host "Checking frontend at http://127.0.0.1:3000"
              Invoke-WebRequest -Uri http://127.0.0.1:3000 -UseBasicParsing -TimeoutSec 10 | Out-Null
              Write-Host "Frontend is responding"
              $frontendReady = $true
            } catch {
              Write-Host "Frontend not ready: $_"
            }

            if ($backendReady -and $frontendReady) {
              break
            }
            Start-Sleep -Seconds 5
          }
          if ((Get-Date) -ge $deadline) {
            Write-Host "==== Backend stdout ===="
            if (Test-Path $backendStdout) {
              Get-Content $backendStdout -Tail 60
            } else {
              Write-Host "No backend stdout found at $backendStdout"
            }
            Write-Host "==== Backend stderr ===="
            if (Test-Path $backendStderr) {
              Get-Content $backendStderr -Tail 60
            } else {
              Write-Host "No backend stderr found at $backendStderr"
            }
            Write-Host "==== Frontend stdout ===="
            if (Test-Path $frontendStdout) {
              Get-Content $frontendStdout -Tail 60
            } else {
              Write-Host "No frontend stdout found at $frontendStdout"
            }
            Write-Host "==== Frontend stderr ===="
            if (Test-Path $frontendStderr) {
              Get-Content $frontendStderr -Tail 60
            } else {
              Write-Host "No frontend stderr found at $frontendStderr"
            }
            throw 'Backend or frontend server failed to start in time.'
          }

      - name: Create frontend E2E test data
        run: |
          python backend/scripts/e2e_test.py

      - name: Run frontend E2E tests
        run: |
          cd frontend
          npm run test:e2e
