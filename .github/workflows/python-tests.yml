name: Python Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-backend.txt
          python -m pip install -r workers/requirements_test.txt

      - name: Run backend tests
        run: |
          python -m pytest backend/test_routes.py -v
          python -m pytest workers/test_video_generator.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps

      - name: Start backend server
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList '-m','uvicorn','backend.app:app','--host','127.0.0.1','--port','8000' -WorkingDirectory "${{ github.workspace }}" -NoNewWindow -PassThru | Out-Null
          Start-Sleep -Seconds 10

      - name: Start frontend server
        shell: pwsh
        run: |
          Start-Process -FilePath npm -ArgumentList 'run','dev','--','--hostname','127.0.0.1','--port','3000' -WorkingDirectory "${{ github.workspace }}\frontend" -NoNewWindow -PassThru | Out-Null
          Start-Sleep -Seconds 20

      - name: Wait for servers
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            $backendReady = $false
            $frontendReady = $false

            try {
              Write-Host "Checking backend at http://127.0.0.1:8000/api/health"
              Invoke-WebRequest -Uri http://127.0.0.1:8000/api/health -UseBasicParsing -TimeoutSec 10 | Out-Null
              Write-Host "Backend is responding"
              $backendReady = $true
            } catch {
              Write-Host "Backend not ready: $_"
            }

            try {
              Write-Host "Checking frontend at http://127.0.0.1:3000"
              Invoke-WebRequest -Uri http://127.0.0.1:3000 -UseBasicParsing -TimeoutSec 10 | Out-Null
              Write-Host "Frontend is responding"
              $frontendReady = $true
            } catch {
              Write-Host "Frontend not ready: $_"
            }

            if ($backendReady -and $frontendReady) {
              break
            }
            Start-Sleep -Seconds 5
          }
          if ((Get-Date) -ge $deadline) {
            throw 'Backend or frontend server failed to start in time.'
          }

      - name: Create frontend E2E test data
        run: |
          python backend/scripts/e2e_test.py

      - name: Run frontend E2E tests
        run: |
          cd frontend
          npm run test:e2e
